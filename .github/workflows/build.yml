name: Build Guai Guai
on:
  push:
    paths:
      - 'GuaiGuai-NeoForge-1.21.1-v0.1.1-source.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Extract original source
        run: unzip -q GuaiGuai-NeoForge-1.21.1-v0.1.1-source.zip
      - name: Build mod
        working-directory: guai_guai_source
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: guaiguai-neoforge-1.21.1-v0.1.1
          path: guai_guai_source/build/libs/*.jar
          if-no-files-found: error
