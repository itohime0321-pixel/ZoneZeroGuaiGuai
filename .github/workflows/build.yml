name: Build Guai Guai v0.1.8
on:
  push:
    branches: [main]
    paths:
      - 'GuaiGuai-NeoForge-1.21.1-v0.1.1-source.zip'
      - 'upgrade_model.py'
      - 'upgrade_v017.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Verify original source and extract
        run: |
          python3 -c "import hashlib,pathlib; p=pathlib.Path('GuaiGuai-NeoForge-1.21.1-v0.1.1-source.zip'); b=p.read_bytes(); assert hashlib.sha1(('blob '+str(len(b))+'\\0').encode()+b).hexdigest()=='a99e203b580d85203c655ab36830e9b0d3ce3159'"
          unzip -q GuaiGuai-NeoForge-1.21.1-v0.1.1-source.zip
      - name: Generate model and optimized v0.1.8 sources
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 upgrade_model.py guai_guai_source
          python3 upgrade_v017.py guai_guai_source
      - name: Test aura timing
        working-directory: guai_guai_source
        run: bash tests/run-timing-tests.sh
      - name: Build mod
        working-directory: guai_guai_source
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: guaiguai-neoforge-1.21.1-v0.1.8
          path: guai_guai_source/build/libs/*.jar
          if-no-files-found: error
